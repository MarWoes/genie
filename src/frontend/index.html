<!doctype html>
<html lang="en" data-theme="light">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Génie Chat</title>
    <link rel="stylesheet" href="/static/lib/daisyui-5.css"/>
    <link rel="stylesheet" href="/static/css/chat.css"/>
    <script src="/static/js/chat.js" defer></script>
    <script src="/static/lib/cdn.min.js" defer></script>
</head>
<body>
<div class="app-shell" x-data="chat()">
    <header class="topbar">
        <a class="brand" href="/" aria-label="Génie home">
            <span class="brand-mark" aria-hidden="true">🧞</span>
            <span>Génie</span>
        </a>
        <nav class="mode-switch" aria-label="Workspace">
            <button class="mode-button selected" aria-current="page">Chat</button>
            <button class="mode-button" disabled title="Evaluate mode coming soon">Evaluate</button>
        </nav>
    </header>

    <main class="chat-main">
        <section class="welcome" x-show="messages.length === 0">
            <p class="eyebrow">GENE ASSISTANT</p>
            <h1>What can I help with?</h1>
            <p>Ask a question about genes and expression.</p>
        </section>
        <div id="messages" class="messages" x-ref="list" aria-live="polite">
            <template x-for="(message, index) in messages" :key="index">
                <div class="chat" :class="message.role === 'user' ? 'chat-end' : 'chat-start'">
                    <div class="chat-image">
                        <span class="chat-avatar" role="img"
                              :aria-label="message.role === 'user' ? 'You' : 'Génie'"
                              x-text="message.role === 'user' ? '👤' : '🧞'"></span>
                    </div>
                    <div class="chat-bubble" :class="message.role === 'user' ? 'chat-bubble-primary' : 'assistant-reply'"
                         x-text="message.content"></div>
                </div>
            </template>
            <div class="chat chat-start" x-show="loading">
                <div class="chat-image">
                    <span class="chat-avatar" role="img" aria-label="Génie">🧞</span>
                </div>
                <div class="chat-bubble"><span class="loading loading-dots loading-sm" role="status"
                                               aria-label="Génie is responding"></span></div>
            </div>
        </div>
        <p class="error" x-show="error" x-text="error" role="alert"></p>
        <form class="composer" @submit.prevent="send()">
          <input class="input" aria-label="Message" placeholder="Message Génie..." x-model="input"
                 :disabled="loading"/>
          <button class="btn btn-primary send-button" type="submit" aria-label="Send message"
                  :disabled="loading || !input.trim()">↑
          </button>
        </form>
    </main>
</div>
</body>
</html>
